<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Job Search — Workspace</title>
<style>
:root{--ink:#171918;--muted:#7a7d78;--line:#e5e7e3;--paper:#f7f8f5;--white:#fff;--accent:#d7ff70;--blue:#e7edff;--red:#ffebe6;--radius:15px}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:#181a18;color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:24px}.brand{font-weight:800;font-size:23px;letter-spacing:-1.3px;padding:0 12px}.brand span{color:var(--accent)}.side small{color:#a5a9a3;padding:0 12px;font-size:10px;letter-spacing:2px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;text-align:left;padding:12px 14px;color:#c0c4bc;border-radius:9px}.nav button.active{background:#33372f;color:#fff}.nav button:hover{background:#30332f}.sidefoot{margin-top:auto;padding:12px;color:#aeb2aa;font-size:12px}.sidefoot strong{color:var(--accent)}main{min-width:0;padding:36px clamp(18px,4vw,62px) 70px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#767b72;font-weight:700}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.1;margin:8px 0 6px}h2{font-size:20px;letter-spacing:-.7px;margin:0}p.sub{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{background:var(--white);border:1px solid #d9ddd5;border-radius:9px;padding:10px 14px;font-weight:650;white-space:nowrap}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.lime{background:var(--accent);border-color:var(--accent);color:var(--ink)}.btn:hover{filter:brightness(.95)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:var(--radius)}.metric{padding:22px}.metric label{color:#777e75;text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700}.metric .num{font-size:39px;letter-spacing:-2px;font-weight:750;margin-top:8px}.metric .hint{font-size:12px;color:var(--muted)}.section{margin-top:25px}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel{padding:22px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.tiny{color:var(--muted);font-size:12px}.bars{display:grid;gap:15px}.barline{display:grid;grid-template-columns:115px 1fr 24px;gap:12px;align-items:center;font-size:12px}.track{height:9px;background:#f0f2ed;border-radius:9px;overflow:hidden}.fill{height:100%;background:#262a25;border-radius:9px}.item{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:13px 0}.item:first-child{border:0}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;background:#f0f2ee;padding:5px 9px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap}.pill.good{background:#e9f5d5}.pill.warn{background:#fff0d4}.pill.bad{background:#ffe6e0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}.search{flex:1;min-width:190px}.field,.search,select,textarea{border:1px solid #dce0d8;border-radius:9px;background:#fff;padding:11px 12px;outline:none;width:100%}.field:focus,.search:focus,select:focus,textarea:focus{border-color:#777e68}.toolbar select{width:auto;max-width:190px}.tablewrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:var(--radius)}table{width:100%;border-collapse:collapse;text-align:left;min-width:900px}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c8278;background:#fbfcfa;white-space:nowrap}th,td{padding:16px 17px;border-bottom:1px solid #edf0ea}tr:last-child td{border:0}td{font-size:13px}td .secondary{font-size:11px;color:var(--muted);margin-top:3px}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f8faf4}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;font-size:18px;color:var(--ink)}.gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formfield{display:grid;gap:6px}.formfield label{font-size:11px;font-weight:750;color:#555d52}.formfield.full{grid-column:1/-1}textarea{min-height:90px;resize:vertical}.dialogback{position:fixed;inset:0;background:#111a14a8;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{background:white;border-radius:17px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:25px}.dialogheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialogfooter{display:flex;justify-content:space-between;margin-top:23px;gap:10px}.close{border:0;background:#f0f1ed;border-radius:8px;padding:7px 12px}.settings{max-width:720px}.note{background:#eef3e7;border-radius:11px;padding:16px;color:#56614b;font-size:13px;margin-top:16px}.goal{height:11px;background:#eef0e9;border-radius:8px;overflow:hidden;margin-top:14px}.goal div{height:100%;background:#b6e94b}.mobilebar{display:none}.hide{display:none!important}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.mobilebar{display:flex;position:sticky;top:0;z-index:5;background:#191b19;color:#fff;padding:10px 15px;gap:8px;overflow:auto}.mobilebar button{background:#30332f;border:0;color:#fff;border-radius:8px;padding:10px;white-space:nowrap}.mobilebar button.active{background:var(--accent);color:#111}main{padding-top:25px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.metrics{gap:9px}.metric{padding:16px}.metric .num{font-size:31px}.twocol{grid-template-columns:1fr}.gridform{grid-template-columns:1fr}.formfield.full{grid-column:auto}.dialog{padding:18px}.toolbar select{max-width:none;flex:1}.actions{width:100%}.actions .btn{flex:1}h1{letter-spacing:-1.3px}}
/* Notion-inspired workspace */
:root{--paper:#fafaf9;--line:#e9e9e7;--radius:9px}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.workspacebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}
.viewtabs{display:flex;gap:3px;border-bottom:1px solid var(--line)}
.viewtabs button{border:0;background:transparent;color:#858681;padding:10px 15px;cursor:pointer;font:inherit}
.viewtabs button.selected{color:#242624;border-bottom:2px solid #222;font-weight:650}
.workspacecount{font-size:12px;color:#92938e}
.kanban{display:flex;gap:14px;overflow-x:auto;padding:4px 0 24px;align-items:flex-start;min-height:330px}
.kanban-col{flex:0 0 255px;min-width:255px}
.kanban-head{display:flex;align-items:center;gap:9px;padding:9px 5px 15px;font-size:13px}
.kanban-dot{width:9px;height:9px;background:#d4d5d0;border-radius:50%}
.kanban-col:nth-child(2) .kanban-dot{background:#c5d7f8}
.kanban-col:nth-child(3) .kanban-dot{background:#f2d19d}
.kanban-col:nth-child(4) .kanban-dot{background:#b9e2c0}
.kanban-col:nth-child(5) .kanban-dot{background:#e4b7b7}
.kanban-count{font-size:11px;color:#898b87;background:#efefec;border-radius:5px;padding:3px 7px}
.kanban-items{display:flex;flex-direction:column;gap:9px}
.jobcard{background:white;border:1px solid #e9e9e6;border-radius:9px;padding:14px;cursor:pointer;box-shadow:0 1px 2px #00000006}
.jobcard:hover{border-color:#bdbeb7;box-shadow:0 3px 12px #0000000a}
.jobcard-company{font-size:12px;color:#777c76;margin-bottom:6px}
.jobcard-title{font-size:14px;font-weight:650;line-height:1.4}
.jobcard-meta{font-size:12px;color:#898b86;margin-top:8px;line-height:1.4}
.jobcard-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:14px}
.jobcard-bottom select,.status-select{font:inherit;font-size:11px;color:#555;border:1px solid #e8e8e5;border-radius:5px;background:#f7f7f5;padding:5px;max-width:145px;cursor:pointer}
.jobcard-date{font-size:11px;color:#898b86}.jobcard-date.late{color:#b35440}
.kanban-empty{font-size:12px;color:#aaa;padding:12px 6px;border:1px dashed #e2e2df;border-radius:7px}
@media(max-width:700px){.workspacebar{align-items:flex-start}.workspacecount{display:none}.kanban-col{flex-basis:235px;min-width:235px}}
.job-web-link{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-width:32px;border:1px solid #e5e6e2;border-radius:7px;color:#545852;background:#fff;text-decoration:none;transition:background .15s,border-color .15s}
.job-web-link:hover{background:#edf5dd;border-color:#b5d17e;color:#171918}
.job-web-link:focus-visible{outline:2px solid #638e1d;outline-offset:2px}
.job-web-link.missing{opacity:.28;cursor:default}
.jobcard-bottom .job-web-link{margin-left:auto}
.jobcard-bottom .jobcard-date{margin-left:auto}
.jobcard-bottom .jobcard-date+.job-web-link{margin-left:0}
.web-column{width:54px;text-align:right}
.dashboard-job-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.job-title-with-link{display:flex;align-items:flex-start;gap:8px}.job-title-with-link>span,.job-title-with-link>b{flex:1;min-width:0}.job-title-with-link .job-web-link{width:26px;height:26px;min-width:26px;flex-shrink:0;border:0;background:transparent;color:#8b8f89}.job-title-with-link .job-web-link:hover{background:#f1f3ed;color:#242724}.job-title-with-link .job-web-link svg{width:16px;height:16px}</style></head><body>
<div class="mobilebar" id="mobileNav"></div><div class="app"><aside class="side"><div class="brand">THE JOB<span>.</span>SEARCH</div><small>Personal workspace</small><nav class="nav" id="nav"></nav><div class="sidefoot"><strong>●</strong> Saved in this browser<br>Export backups regularly.</div></aside><main id="main"></main></div><div id="overlay"></div>
<script src="config.js"></script>
<script>
const KEY='jobsearch_workspace_v1';
const initial={applications:[],companies:[
{id:'c1',name:'Base Design',industry:'Design studio',website:'https://www.basedesign.com/',location:'Brussels',role:'Brand / Graphic Design',interest:5,status:'To research',nextAction:'Check careers and send portfolio'},
{id:'c2',name:'Hangar',industry:'Music / Culture',location:'Brussels',role:'Event / Creative / Marketing',interest:5,status:'To research',nextAction:'Identify relevant contact'},
{id:'c3',name:'Wonka',industry:'AI / Technology',location:'To confirm',role:'AI / Creative Technology',interest:5,status:'To research',nextAction:'Confirm company and suitable roles'},
{id:'c4',name:'Profirst',industry:'Event agency',location:'Brussels',role:'Event / Creative / Project Management',interest:5,status:'To research',nextAction:'Review opportunities and tailor portfolio'}],
settings:{targetNet:2500,weeklyGoal:5,home:'Ixelles, Brussels'}};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){data=structuredClone(initial)}
data.applications??=[];data.companies??=[];data.settings??=initial.settings;
let page='dashboard',query='',filter='All',appView=localStorage.getItem('tjs_app_view')||'board';
const statuses=['Interested','Preparing','Applied','Follow-up','Interview 1','Interview 2','Final interview','Assignment','Offer','Accepted','Rejected','Withdrawn','No response'];
const cats=['Creative Director','Art Director','Graphic Designer','Brand Designer','Marketing Manager','Marketing Coordinator','Event Manager','Event Producer','Project Manager','Communications','AI / Creative Technology','AI / Marketing','Other'];
const industries=['Creative agency','Design studio','Events','Music / Culture','AI / Technology','Startup','Corporate','Other'];
const arrangements=['On-site','Hybrid','Remote'];
const today=()=>new Date().toISOString().slice(0,10);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number.isFinite(+v)&&v!==''&&v!=null?new Intl.NumberFormat('en-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+v):'—';
const dt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
let save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const id=()=>String(Date.now())+Math.random().toString(36).slice(2,6);
const estimateNet=g=>g?Math.max(0,Math.round((+g*0.8693-300)*.78+300)):null; // approximate only
const score=a=>{let x=[];if(a.interest)x.push(+a.interest/5*50);if(a.gross)x.push(Math.min(1,estimateNet(a.gross)/data.settings.targetNet)*25);if(a.commute!==''&&a.commute!=null)x.push(Math.max(0,1-(+a.commute/90))*15);if(a.arrangement)x.push(({Remote:10,Hybrid:8,'On-site':4})[a.arrangement]||0);return x.length?Math.round(x.reduce((u,v)=>u+v,0)/( (a.interest?50:0)+(a.gross?25:0)+(a.commute!==''&&a.commute!=null?15:0)+(a.arrangement?10:0))*100):null};
const due=a=>a.followUp&&a.followUp<=today()&&!['Accepted','Rejected','Withdrawn'].includes(a.status);
const options=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');
const navs=[['dashboard','▦','Dashboard'],['applications','◫','Applications'],['companies','◈','Companies'],['settings','⚙','Settings']];
function nav(){let h=navs.map(([key,ic,name])=>`<button class="${page===key?'active':''}" onclick="go('${key}')">${ic} &nbsp; ${name}</button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('mobileNav').innerHTML=h}
function go(p){page=p;query='';filter='All';render()}
function header(kicker,title,subtitle,buttons=''){return `<div class="top"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="actions">${buttons}</div></div>`}
function jobLink(a){
 const raw=String(a.jobUrl||'').trim();
 if(!raw)return '';
 try{const url=new URL(raw);if(!['https:','http:'].includes(url.protocol))return '';return url.href}catch(e){return ''}
}
function jobWebIcon(a){
 const url=jobLink(a);
 return url?`<a class="job-web-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open original job listing" aria-label="Open original job listing"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-10 10"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg></a>`:`<span class="job-web-link missing" title="No job URL saved" aria-label="No job URL saved"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-10 10"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg></span>`;
}
function badge(s){let cl=/Accepted|Offer|Interview/.test(s)?'good':/Rejected|Withdrawn|Overdue/.test(s)?'bad':/Follow-up|Preparing|Assignment/.test(s)?'warn':'';return `<span class="pill ${cl}">${esc(s||'Interested')}</span>`}
function metric(name,value,hint){return `<div class="metric"><label>${name}</label><div class="num">${value}</div><div class="hint">${hint}</div></div>`}
function dashboard(){let apps=data.applications;let applied=apps.filter(a=>!['Interested','Preparing'].includes(a.status)).length;let interviews=apps.filter(a=>/Interview|Assignment|Offer|Accepted/.test(a.status)).length;let offers=apps.filter(a=>['Offer','Accepted'].includes(a.status)).length;let overdue=apps.filter(due);let week=new Date();week.setDate(week.getDate()-7);let weekly=apps.filter(a=>a.applied&&new Date(a.applied)>=week).length;let distribution=statuses.map(s=>({s,n:apps.filter(a=>a.status===s).length})).filter(o=>o.n);let max=Math.max(1,...distribution.map(o=>o.n));let next=apps.filter(a=>a.followUp&&!['Rejected','Withdrawn','Accepted'].includes(a.status)).sort((a,b)=>a.followUp.localeCompare(b.followUp)).slice(0,6);
return header('Overview','Your next move.','A clear view of your job search, from first contact to final offer.',`<button class="btn" onclick="exportJSON()">↓ Export data</button><button class="btn primary" onclick="edit('application')">+ New application</button>`)+
`<div class="metrics">${metric('Target companies',data.companies.length,'Companies on your radar')}${metric('Applications sent',applied,'${apps.length} opportunities total')}${metric('Interview pipeline',interviews,'${applied?Math.round(interviews/applied*100):0}% conversion')}${metric('Offers',offers,'${overdue.length} follow-ups due')}</div>
<div class="section twocol"><div class="panel"><div class="panel-head"><h2>Application pipeline</h2><span class="tiny">${apps.length} opportunities</span></div>${distribution.length?`<div class="bars">${distribution.map(o=>`<div class="barline"><span>${esc(o.s)}</span><div class="track"><div class="fill" style="width:${o.n/max*100}%"></div></div><b>${o.n}</b></div>`).join('')}</div>`:`<div class="empty"><strong>No applications yet</strong>Add your first opportunity to populate the pipeline.</div>`}</div>
<div class="panel"><div class="panel-head"><h2>Next actions</h2><span class="tiny">Follow-ups</span></div>${next.length?next.map(a=>`<div class="item"><div><strong>${esc(a.company)} · ${esc(a.title)}</strong><small>${esc(a.nextAction||'Follow up')}</small></div><div class="dashboard-job-actions">${badge(due(a)?'Overdue':dt(a.followUp))}${jobWebIcon(a)}</div></div>`).join(''):`<div class="empty"><strong>All clear</strong>Nothing scheduled yet.</div>`}</div></div>
<div class="section twocol"><div class="panel"><div class="panel-head"><h2>Weekly goal</h2><span class="tiny">${weekly} / ${data.settings.weeklyGoal} applications</span></div><p class="sub">Applications submitted in the last 7 days</p><div class="goal"><div style="width:${Math.min(100,weekly/data.settings.weeklyGoal*100)}%"></div></div></div>
<div class="panel"><div class="panel-head"><h2>Salary ambition</h2><span class="tiny">Monthly take-home target</span></div><div style="font-size:35px;font-weight:750;letter-spacing:-1px">${money(data.settings.targetNet)}</div><p class="sub">Estimated net figures are indicative, not payroll calculations.</p></div></div>`}
function applications(){return header('Your workspace','Job opportunities','Track every role from discovery to decision.',`<button class="btn" onclick="exportCSV()">↓ Export CSV</button><button class="btn primary" onclick="edit('application')">+ New job</button>`)+`<div class="workspacebar"><div class="viewtabs"><button class="${appView==='board'?'selected':''}" onclick="setAppView('board')">▥ Board</button><button class="${appView==='table'?'selected':''}" onclick="setAppView('table')">☷ Table</button></div><span class="workspacecount">${data.applications.length} saved opportunities</span></div><div class="toolbar"><input class="search" placeholder="Search roles, companies, locations…" value="${esc(query)}" oninput="query=this.value;drawTable()"><select onchange="filter=this.value;drawTable()"><option ${filter==='All'?'selected':''}>All</option><option ${filter==='Follow-ups due'?'selected':''}>Follow-ups due</option>${options(statuses,filter)}</select></div><div id="results"></div>`}
function setAppView(v){appView=v;localStorage.setItem('tjs_app_view',v);render()}
function changeAppStatus(e,recordId){e.stopPropagation();const a=data.applications.find(x=>x.id===recordId);if(!a)return;a.status=e.target.value;save();drawTable()}
function drawTable(){
 if(page!=='applications')return;
 const list=data.applications.filter(a=>(filter==='All'||a.status===filter||filter==='Follow-ups due'&&due(a))&&[a.company,a.title,a.category,a.location,a.languages].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(b.applied||b.posted||'').localeCompare(a.applied||a.posted||''));
 const root=document.getElementById('results');
 if(!list.length){root.innerHTML=`<div class="panel empty"><strong>No jobs here yet</strong><p>Save a role with your Chrome extension, or add one manually.</p><button class="btn primary" onclick="edit('application')">+ Add a job</button></div>`;return}
 if(appView==='board'){
 const groups=[
  {name:'Saved',statuses:['Interested','Preparing']},
  {name:'Applied',statuses:['Applied','Follow-up','No response']},
  {name:'Interviewing',statuses:['Interview 1','Interview 2','Final interview','Assignment']},
  {name:'Offer',statuses:['Offer','Accepted']},
  {name:'Closed',statuses:['Rejected','Withdrawn']}
 ];
 root.innerHTML=`<div class="kanban">${groups.map(g=>{const items=list.filter(a=>g.statuses.includes(a.status));return `<section class="kanban-col"><div class="kanban-head"><span class="kanban-dot"></span><strong>${g.name}</strong><span class="kanban-count">${items.length}</span></div><div class="kanban-items">${items.map(a=>`<article class="jobcard" onclick="edit('application','${a.id}')"><div class="jobcard-company">${esc(a.company||'Unknown company')}</div><div class="jobcard-title job-title-with-link"><span>${esc(a.title||'Untitled role')}</span>${jobWebIcon(a)}</div><div class="jobcard-meta">${esc(a.location||'Location not set')}${a.arrangement?' · '+esc(a.arrangement):''}</div><div class="jobcard-bottom"><select aria-label="Job status" onclick="event.stopPropagation()" onchange="changeAppStatus(event,'${a.id}')">${options(statuses,a.status||'Interested')}</select>${a.followUp?`<span class="jobcard-date ${due(a)?'late':''}">↗ ${dt(a.followUp)}</span>`:''}</div></article>`).join('')||'<div class="kanban-empty">No opportunities</div>'}</div></section>`}).join('')}</div>`;return
 }
 root.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Role</th><th>Status</th><th>Location</th><th>Salary</th><th>Follow-up</th></tr></thead><tbody>${list.map(a=>`<tr class="clickable" onclick="edit('application','${a.id}')"><td><div class="job-title-with-link"><b>${esc(a.title||'Untitled role')}</b>${jobWebIcon(a)}</div><div class="secondary">${esc(a.company||'Unknown company')}</div></td><td><select class="status-select" onclick="event.stopPropagation()" onchange="changeAppStatus(event,'${a.id}')">${options(statuses,a.status||'Interested')}</select></td><td>${esc(a.location||'—')}</td><td>${money(a.gross)}</td><td>${a.followUp?dt(a.followUp):'—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function companies(){let list=data.companies.filter(c=>[c.name,c.industry,c.location,c.role].join(' ').toLowerCase().includes(query.toLowerCase()));return header('Discovery','Companies.','Your shortlist for open roles and spontaneous applications.',`<button class="btn primary" onclick="edit('company')">+ Add company</button>`)+`<div class="toolbar"><input class="search" placeholder="Search your target companies…" value="${esc(query)}" oninput="query=this.value;drawCompanies()"></div><div id="results"></div>`}
function drawCompanies(){let list=data.companies.filter(c=>[c.name,c.industry,c.location,c.role].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('results').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Industry</th><th>Location</th><th>Roles to explore</th><th>Interest</th><th>Outreach status</th><th>Next action</th></tr></thead><tbody>${list.map(c=>`<tr class="clickable" onclick="edit('company','${c.id}')"><td><b>${esc(c.name)}</b><div class="secondary">${c.website?`<a href="${esc(c.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Website ↗</a>`:'—'}</div></td><td>${esc(c.industry||'—')}</td><td>${esc(c.location||'—')}</td><td>${esc(c.role||'—')}</td><td>${'★'.repeat(+c.interest||0)}</td><td>${badge(c.status)}</td><td>${esc(c.nextAction||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="panel empty"><strong>No companies found</strong>Add one to start your shortlist.</div>`}
function settings(){return header('Preferences','Settings.','Adjust your goals and keep your data portable.')+`<div class="settings panel"><div class="gridform"><div class="formfield"><label>Preferred net salary / month (€)</label><input class="field" id="targetNet" type="number" value="${esc(data.settings.targetNet)}"></div><div class="formfield"><label>Weekly application target</label><input class="field" id="weeklyGoal" type="number" min="1" value="${esc(data.settings.weeklyGoal)}"></div><div class="formfield full"><label>Commute origin</label><input class="field" id="home" value="${esc(data.settings.home)}"></div></div><div style="margin-top:18px"><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="note">Salary estimates use a simplified Belgian employee-pay approximation and can differ substantially from actual net pay due to withholding, tax status, benefits and other factors. Commute thresholds: ≤30, 31–45, 46–60, and >60 minutes.</div></div><div class="settings panel section"><div class="panel-head"><h2>Your data</h2></div><p class="sub">Everything is stored locally in this browser. Export a JSON backup to move devices or avoid data loss. This version does not sync automatically with Google Sheets.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="exportJSON()">Export backup (.json)</button><button class="btn" onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></div></div>`}
function saveSettings(){data.settings={targetNet:Math.max(1,+document.getElementById('targetNet').value||2500),weeklyGoal:Math.max(1,+document.getElementById('weeklyGoal').value||5),home:document.getElementById('home').value};save();render()}
function render(){nav();document.getElementById('main').innerHTML=({dashboard,applications,companies,settings})[page]();if(page==='applications')drawTable();if(page==='companies')drawCompanies()}
const appFields=[
['company','Company','text',1],['title','Job title','text',1],['category','Job category','select',0,cats],['industry','Industry','select',0,industries],
['employment','Employment type','select',0,['Full-time','Part-time','Freelance','Contract','Internship']],['opportunity','Opportunity type','select',0,['Published opening','Spontaneous application']],['location','City / location','text'],['arrangement','Work arrangement','select',0,arrangements],['commute','Commute one way (minutes)','number'],['languages','Required languages','text'],['languageFit','Language fit','select',0,['Strong match','Partial match','Not a match','Unknown']],['jobUrl','Job posting URL','url'],['posted','Job posting date','date'],['applied','Application date','date'],['status','Application status','select',0,statuses],['interest','Personal interest (1–5)','select',0,['1','2','3','4','5']],['gross','Advertised gross / month (€)','number'],['expectedGross','Expected gross / month (€)','number'],['benefits','Benefits / perks','text'],['contact','Contact name','text'],['contactRole','Contact role','text'],['email','Contact email / LinkedIn','text'],['lastContact','Last contact date','date'],['nextAction','Next action','text'],['followUp','Follow-up date','date'],['interview1','Interview 1','datetime-local'],['interview2','Interview 2','datetime-local'],['finalInterview','Final interview','datetime-local'],['assignment','Assignment / deadline','date'],['notes','Notes / interview feedback','textarea',1]];
const companyFields=[['name','Company','text',1],['industry','Industry','text'],['website','Website','url'],['location','Location','text'],['role','Target department / role','text'],['interest','Interest (1–5)','select',0,['1','2','3','4','5']],['status','Outreach status','select',0,['To research','Ready to contact','Contacted','Follow-up','In conversation','Not interested']],['contact','Contact name','text'],['email','Contact email / LinkedIn','text'],['lastContact','Last contacted','date'],['nextAction','Next action','text'],['followUp','Follow-up date','date'],['notes','Notes','textarea',1]];
function fieldHtml(f,v){let [key,label,type,full,choices]=f;let value=v[key]??'';let control=type==='select'?`<select name="${key}"><option value="">Select…</option>${choices.map(o=>`<option value="${esc(o)}" ${String(value)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(value)}</textarea>`:`<input class="field" name="${key}" type="${type}" value="${esc(value)}" ${key==='company'||key==='name'?'required':''}>`;return `<div class="formfield ${full?'full':''}"><label>${label}</label>${control}</div>`}
function edit(type,recordId){let isApp=type==='application',arr=isApp?data.applications:data.companies,record=arr.find(x=>x.id===recordId)||{},fields=isApp?appFields:companyFields;document.getElementById('overlay').innerHTML=`<div class="dialogback" onclick="if(event.target===this)closeDialog()"><div class="dialog"><div class="dialogheader"><div><div class="eyebrow">${isApp?'Recruitment pipeline':'Company shortlist'}</div><h2>${recordId?'Edit':'New'} ${type}</h2></div><button class="close" onclick="closeDialog()">✕</button></div><form id="entryForm" onsubmit="submitEntry(event,'${type}','${recordId||''}')"><div class="gridform">${fields.map(f=>fieldHtml(f,record)).join('')}</div><div class="dialogfooter"><div>${recordId?`<button type="button" class="btn" onclick="removeEntry('${type}','${recordId}')">Delete</button>`:''}</div><div class="actions"><button type="button" class="btn" onclick="closeDialog()">Cancel</button><button type="submit" class="btn primary">Save ${type}</button></div></div></form></div></div>`}
function closeDialog(){document.getElementById('overlay').innerHTML=''}
function submitEntry(e,type,recordId){e.preventDefault();let arr=type==='application'?data.applications:data.companies;let v=Object.fromEntries(new FormData(e.target).entries());if(!v.company&&!v.name){alert('Enter a company name');return}let prev=arr.find(a=>a.id===recordId);if(prev)Object.assign(prev,v);else arr.unshift({...v,id:id(),status:v.status||(type==='application'?'Interested':'To research')});save();closeDialog();render()}
function removeEntry(type,recordId){if(!confirm('Delete this record?'))return;let arr=type==='application'?data.applications:data.companies;arr.splice(arr.findIndex(a=>a.id===recordId),1);save();closeDialog();render()}
function download(name,content,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('job-search-backup.json',JSON.stringify(data,null,2),'application/json')}
function exportCSV(){let fields=appFields.map(x=>x[0]);let rows=[fields,...data.applications.map(a=>fields.map(f=>a[f]??''))];download('job-search-applications.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.applications)||!Array.isArray(incoming.companies))throw Error('Invalid backup');if(!confirm('Replace your current data with this backup?'))return;data={...structuredClone(initial),...incoming};save();render()}catch(e){alert('Could not import backup: '+e.message)}}
render();

<script>
// Job Save Chrome extension import bridge. The URL fragment is removed immediately.
(function(){
  const prefix='#jobimport=';
  if(!location.hash.startsWith(prefix))return;
  const encoded=location.hash.slice(prefix.length);
  history.replaceState(null,'',location.pathname+location.search);
  try {
    if(encoded.length>20000)throw Error('Import too large');
    const job=JSON.parse(decodeURIComponent(encoded));
    if(!job || typeof job!=='object' || !job.company || !job.title || !/^https?:\/\//.test(job.jobUrl||''))throw Error('Invalid job');
    const allowed=['company','title','location','jobUrl','posted','employment','arrangement','languages','gross','notes','status','opportunity','nextAction'];
    const record={id:id(),status:'Interested',opportunity:'Published opening',...Object.fromEntries(allowed.filter(k=>typeof job[k]==='string'||typeof job[k]==='number').map(k=>[k,String(job[k]).slice(0,k==='notes'?4000:500)]))};
    if(typeof job.jobType==='string' && !record.employment)record.employment=job.jobType.slice(0,500);
    const existing=data.applications.find(a=>a.jobUrl && a.jobUrl.split('?')[0]===record.jobUrl.split('?')[0]);
    if(existing){
      if(confirm('This job URL is already in your tracker. Open its record?')){page='applications';render();edit('application',existing.id)}
      return;
    }
    if(!confirm('Save "'+record.title.slice(0,90)+'" at '+record.company.slice(0,90)+' to your job tracker?'))return;
    data.applications.unshift(record);
    save();page='applications';render();edit('application',record.id);
  }catch(e){alert('Job import failed: '+e.message)}
})();
</script>
