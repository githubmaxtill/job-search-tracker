<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Job Search — Workspace</title>
<style>
:root{--ink:#171918;--ink2:#3d413b;--muted:#7a7d78;--line:#e9e9e6;--line2:#dfe1dc;--paper:#fafaf9;--white:#fff;--accent:#d7ff70;--accent2:#b6e94b;--late:#b3452f;--late-bg:#fff0ec;--warn:#9a6a12;--warn-bg:#fff5e0;--good-bg:#eaf6dc;--radius:10px;
--s-Saved:#b4b7b0;--s-Applied:#7f9cf5;--s-Interviewing:#e6a74b;--s-Offer:#5bb36f;--s-Closed:#c99393}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid #638e1d;outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:#181a18;color:#fff;padding:26px 14px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:21px;letter-spacing:-1.2px;padding:0 10px}.brand span{color:var(--accent)}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;text-align:left;padding:10px 12px;color:#c0c4bc;border-radius:8px}
.nav button svg{width:17px;height:17px;flex-shrink:0}
.nav button:hover{background:#2a2d29}.nav button.active{background:#33372f;color:#fff}
.nav .badge{margin-left:auto;background:var(--accent);color:#111;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.nav .badge.late{background:#ff8f78}
.sidefoot{margin-top:auto;padding:10px;color:#aeb2aa;font-size:12px;display:grid;gap:10px}
.sidefoot .dot{color:var(--accent)}
#cloud-button{color:#111!important}
#cloud-widget.inline{position:static!important;background:#232622!important;box-shadow:none!important;padding:10px!important;border-radius:9px!important;max-width:none!important}
main{min-width:0;padding:30px clamp(18px,3.4vw,48px) 70px;max-width:1440px;width:100%;margin:0 auto}
.tabbar{display:none}

/* Type & primitives */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#7b7f77;font-weight:700}
h1{font-size:clamp(26px,3vw,34px);letter-spacing:-1.3px;line-height:1.1;margin:6px 0 5px}
h2{font-size:16px;letter-spacing:-.3px;margin:0}
p.sub,.sub{color:var(--muted);margin:0}
.tiny{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--white);border:1px solid var(--line2);border-radius:8px;padding:9px 13px;font-weight:600;white-space:nowrap;line-height:1.2}
.btn:hover{background:#f3f4f1}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:hover{background:#2c302b}
.btn.lime{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--late)}.btn.danger:hover{background:var(--late-bg);border-color:#f2c4b8}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.panel,.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.panel{padding:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.section{margin-top:16px}
.twocol{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric{padding:16px 18px}
.metric label{color:#777e75;text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700}
.metric .num{font-size:30px;letter-spacing:-1.3px;font-weight:750;margin:4px 0 2px}
.metric .num small{font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0}
.metric .hint{font-size:12px;color:var(--muted)}
.goal{height:7px;background:#eef0e9;border-radius:8px;overflow:hidden;margin-top:8px}.goal div{height:100%;background:var(--accent2)}
.pill{display:inline-block;background:#f0f2ee;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:650;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:3px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s-Saved);flex-shrink:0}
.s-Applied{background:var(--s-Applied)}.s-Interviewing{background:var(--s-Interviewing)}.s-Offer{background:var(--s-Offer)}.s-Closed{background:var(--s-Closed)}
.dots{letter-spacing:1px;font-size:9px;color:#262a25;white-space:nowrap}.dots i{font-style:normal;color:#d6d8d2}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-bg);border:1px solid #f3dfb4;color:#6f520f;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px}

/* Fields */
.field,select,textarea,.search{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:9px 11px;outline:none;width:100%;min-width:0}
.field:focus,select:focus,textarea:focus,.search:focus{border-color:#7d846f;box-shadow:0 0 0 3px #d7ff7055}
textarea{min-height:96px;resize:vertical}
.gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formfield{display:grid;gap:5px;align-content:start}.formfield.full{grid-column:1/-1}
.formfield label{font-size:11px;font-weight:700;color:#555d52}
.hintline{font-size:12px;color:var(--muted)}

/* Today */
.agroup{margin-top:6px}.agroup+.agroup{margin-top:14px}
.agroup-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7b7f77;padding:4px 0 6px}
.agroup-h span{background:#f0f1ed;border-radius:10px;padding:0 7px;letter-spacing:0;color:#555}
.agroup-h.late{color:var(--late)}.agroup-h.warn{color:var(--warn)}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f0f1ed}
.arow-main{flex:1;min-width:0;cursor:pointer}
.arow-main strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-main small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-main:hover strong{text-decoration:underline;text-underline-offset:3px}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid #b9bdb4;background:#fff;flex-shrink:0;padding:0;position:relative}
.check:hover{border-color:#5d7c22;background:var(--good-bg)}
.check:hover::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #5d7c22;border-width:0 2px 2px 0;transform:rotate(45deg)}
.when{font-size:12px;color:var(--muted);white-space:nowrap}.arow.late .when{color:var(--late);font-weight:600}
.mini{border:1px solid var(--line2);background:#fff;border-radius:6px;font-size:11px;padding:4px 7px;white-space:nowrap;color:var(--ink2)}
.mini:hover{background:#f3f4f1}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #f0f1ed;padding:10px 0;cursor:pointer}
.item:first-of-type{border-top:0}
.item strong{display:block;font-weight:600}.item small{color:var(--muted)}
.funnel{display:grid;gap:11px}
.fline{display:grid;grid-template-columns:82px 1fr 64px;gap:10px;align-items:center;font-size:12px}
.track{height:8px;background:#f0f2ed;border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}
.fline b{font-size:13px}.fline em{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.welcome{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.welcome .panel{display:grid;gap:8px;align-content:start}
.welcome .n{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:750;font-size:13px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:13px}
.flow>span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ink)}

/* Pipeline */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.viewtabs{display:flex;background:#efefec;border-radius:8px;padding:3px}
.viewtabs button{border:0;background:transparent;color:#6c6f69;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px}
.viewtabs button.selected{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0000001a}
.toolbar{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end;min-width:260px}
.toolbar .search{max-width:340px}.toolbar select{width:auto;max-width:200px}
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 20px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:1 1 0;min-width:236px;background:#f2f2ef;border-radius:12px;padding:10px;scroll-snap-align:start;transition:background .12s}
.col.collapsed{flex:0 0 170px;min-width:170px}
.col.over{background:#e7f3cf;outline:2px dashed #9fca4a}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-size:13px}
.count{font-size:11px;color:#777a74;background:#fff;border-radius:5px;padding:1px 7px}
.col-items{display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-empty{font-size:12px;color:#9b9d98;padding:14px 8px;border:1px dashed #d9dad5;border-radius:8px;text-align:center}
.col-collapsed{border:1px dashed #d1d3cd;background:transparent;border-radius:8px;padding:14px 8px;font-size:12px;color:#6c6f69;text-align:center}
.card{background:#fff;border:1px solid #e6e6e2;border-radius:9px;padding:11px 12px;cursor:pointer;box-shadow:0 1px 2px #00000008}
.card:hover{border-color:#bdbeb7;box-shadow:0 3px 12px #0000000d}
.card.dragging{opacity:.45}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.card-co{font-size:12px;color:#6f736d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{display:flex;align-items:flex-start;gap:6px;font-weight:650;line-height:1.35}.card-title span{flex:1;min-width:0}
.card-meta{font-size:12px;color:#8a8c86;margin-top:3px}
.step{font-size:12px;margin-top:8px;padding:5px 7px;border-radius:6px;background:#f5f6f3;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.late{background:var(--late-bg);color:var(--late);font-weight:600}.step.today{background:var(--warn-bg);color:var(--warn);font-weight:600}
.step.none{background:transparent;border:1px dashed #e0c896;color:var(--warn)}.step.closed{background:transparent;padding-left:0;color:var(--muted)}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:9px}
.stage-select{font-size:11px;border:1px solid #e6e6e2;border-radius:5px;background:#f7f7f5;padding:4px 5px;width:auto;max-width:150px;cursor:pointer}
.age{margin-left:auto;font-size:11px;color:#9a9c97}
.src{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#7b7f77;background:#f0f1ed;border-radius:4px;padding:1px 5px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:960px}
th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c8278;background:#fbfcfa;white-space:nowrap;font-weight:700;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--ink)}
th,td{padding:10px 12px;border-bottom:1px solid #eff1ec;vertical-align:middle}
tr:last-child td{border-bottom:0}td{font-size:13px}
tbody tr{cursor:pointer}tbody tr:hover{background:#fafbf7}tbody tr.selected{background:#f4fae6}
td:nth-child(2){min-width:210px}
td .secondary{font-size:12px;color:var(--muted);margin-top:1px}
.role{display:flex;align-items:center;gap:6px}
.inline{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;width:100%}
.inline:hover{border-color:var(--line2);background:#fff}.inline:focus{border-color:#7d846f;background:#fff;outline:none}
.inline.date{width:132px}.inline.late{color:var(--late);font-weight:600}
.nextcell{display:flex;gap:4px;align-items:center;min-width:290px}
.bulk{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.bulk select{width:auto;padding:5px 8px;font-size:12px;color:var(--ink)}
.bulk .link{color:#fff;margin-left:auto}
.bulk .btn{padding:5px 10px;font-size:12px}
.job-web-link{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;min-width:24px;border-radius:6px;color:#8b8f89;text-decoration:none}
.job-web-link:hover{background:#edf5dd;color:#171918}
.job-web-link svg{width:15px;height:15px}

/* Drawer */
.drawer-back{position:fixed;inset:0;background:#11141126;z-index:20;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:#fff;z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px #0000001f;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
.d-head{padding:16px 22px 14px;border-bottom:1px solid var(--line)}
.d-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.d-top .eyebrow{flex:1}
.savestate{font-size:11px;color:var(--muted)}
.close{border:0;background:#f0f1ed;border-radius:7px;padding:6px 10px}.close:hover{background:#e6e8e2}
.d-title{border:1px solid transparent;border-radius:7px;font-size:21px;font-weight:750;letter-spacing:-.6px;padding:3px 6px;margin-left:-7px;width:calc(100% + 7px);background:transparent}
.d-title:hover{border-color:var(--line)}.d-title:focus{border-color:#7d846f;outline:none}
.d-sub{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.d-company{border:1px solid transparent;border-radius:7px;padding:3px 6px;margin-left:-7px;color:var(--ink2);background:transparent;flex:1;min-width:0}
.d-company:hover{border-color:var(--line)}.d-company:focus{border-color:#7d846f;outline:none}
.stars{display:flex;gap:1px}.stars button{border:0;background:none;padding:0 1px;font-size:17px;line-height:1;color:#d6d8d2}.stars button.on{color:#262a25}.stars button:hover{color:#5d7c22}
.stepper{display:flex;gap:4px}
.stepper button{flex:1;border:1px solid var(--line2);background:#fff;border-radius:7px;padding:7px 4px;font-size:12px;font-weight:600;color:#6c6f69;display:flex;align-items:center;justify-content:center;gap:5px}
.stepper button.past{background:#f4f5f2;color:#555}
.stepper button.current{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper button:hover:not(.current){border-color:#9a9e94}
.outcome{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}.outcome select{width:auto;padding:5px 8px;font-size:12px}
.d-body{flex:1;overflow-y:auto;padding:16px 22px 30px}
.nextstep{border:1px solid var(--line);background:#fbfcf8;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.nextstep.late{border-color:#f2c4b8;background:var(--late-bg)}.nextstep.none{border-color:#f0dcae;background:var(--warn-bg)}
.nextstep>label{display:block;font-size:11px;font-weight:700;color:#555d52;margin-bottom:6px}
.ns-row{display:grid;grid-template-columns:1fr 150px;gap:8px}
.ns-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ns-quick .done{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#111;font-weight:650}
details.grp{border-top:1px solid var(--line);padding:4px 0}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 0;font-weight:650;display:flex;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"";width:6px;height:6px;border:solid #8a8e86;border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);transition:transform .15s;margin-right:3px}
details.grp[open]>summary::before{transform:rotate(45deg)}
details.grp>summary .count{background:#f0f1ed}
.grp-body{padding:2px 0 14px}
.estimate{font-size:12px;color:var(--muted);margin-top:8px}
.iv{display:grid;grid-template-columns:190px 140px 1fr 28px;gap:6px;margin-bottom:6px}
.iv .x{border:0;background:none;color:#999;border-radius:6px}.iv .x:hover{background:var(--late-bg);color:var(--late)}
.act-add{display:flex;gap:6px;margin-bottom:10px}
.act{display:grid;grid-template-columns:86px 1fr;gap:8px;font-size:12px;padding:5px 0;border-top:1px dashed #eceee9}
.act time{color:var(--muted)}
.jobrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #f0f1ed;cursor:pointer}
.jobrow:hover b{text-decoration:underline;text-underline-offset:3px}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);background:#fcfcfb}

/* Dialogs (also used by cloud.js) */
.dialogback{position:fixed;inset:0;background:#111a14a8;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
.dialog{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px}
.dialog.sm{width:min(520px,100%)}
.dialogheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.dialogfooter{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}

.dialog .formfield+.gridform,.dialog .gridform+.formfield,.dialog .formfield+.formfield{margin-top:12px}
.dialog .gridform>.formfield{margin-top:0}
.seg{display:flex;background:#efefec;border-radius:8px;padding:3px;gap:2px}
.seg label{flex:1;text-align:center;padding:6px;border-radius:6px;font-size:13px;font-weight:600;color:#6c6f69;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:#fff;color:var(--ink);box-shadow:0 1px 2px #0000001a}
.dup{background:var(--warn-bg);border:1px solid #f0dcae;border-radius:9px;padding:10px 12px;margin-top:14px;font-size:13px;color:#6f520f}
.dup .actions{margin-top:8px}
.note{background:#eef3e7;border-radius:10px;padding:14px;color:#56614b;font-size:13px;margin-top:14px}
.outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Data */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cards .panel h2{margin-bottom:6px}.cards .panel .actions{margin-top:14px}
.drop{display:block;border:1.5px dashed #c9ccc4;border-radius:10px;padding:26px 16px;text-align:center;margin-top:14px;cursor:pointer;color:var(--muted);background:#fbfcfa}
.drop:hover,.drop.over{border-color:#8fb33f;background:#f4fae6}
.drop strong{color:var(--ink)}
.drop input{display:none}
.maptable{min-width:0;margin-top:6px}
.maptable td,.maptable th{padding:7px 8px}
.maptable select{padding:6px 8px;font-size:13px}
.maptable .sample{color:var(--muted);font-size:12px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings{max-width:720px}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#181a18;color:#fff;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:14px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 8px 30px #0003;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

@media(max-width:1100px){.twocol{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 main{padding:20px 16px 100px}

<datalist id="companyList"></datalist>
<script src="config.js"></script>
<script>
const KEY='jobsearch_workspace_v1';
const SEED_COMPANIES=[
{id:'c1',name:'Base Design',industry:'Design studio',website:'https://www.basedesign.com/',location:'Brussels',role:'Brand / Graphic Design',interest:5,status:'To research',nextAction:'Check careers and send portfolio'},
{id:'c2',name:'Hangar',industry:'Music / Culture',location:'Brussels',role:'Event / Creative / Marketing',interest:5,status:'To research',nextAction:'Identify relevant contact'},
{id:'c3',name:'Wonka',industry:'AI / Technology',location:'To confirm',role:'AI / Creative Technology',interest:5,status:'To research',nextAction:'Confirm company and suitable roles'},
{id:'c4',name:'Profirst',industry:'Event agency',location:'Brussels',role:'Event / Creative / Project Management',interest:5,status:'To research',nextAction:'Review opportunities and tailor portfolio'}];
const DEFAULT_SETTINGS={targetNet:2500,weeklyGoal:5,home:'Ixelles, Brussels',followUpDays:7,staleDays:21,lastBackup:''};
const initial=()=>({applications:[],companies:structuredClone(SEED_COMPANIES),settings:{...DEFAULT_SETTINGS}});

// One stage per board column; how a closed job ended is a separate outcome.
const STAGES=['Saved','Applied','Interviewing','Offer','Closed'];
const ACTIVE_STAGES=['Applied','Interviewing','Offer'];
const OUTCOMES=['Rejected','No response','Withdrawn','Declined offer','Accepted'];
const NEXT={Saved:'Tailor CV and apply',Applied:'Follow up on application',Interviewing:'Prepare for the next interview',Offer:'Review the offer and decide'};
// Statuses used by the previous version, the Chrome extension and old CSV exports.
const LEGACY={interested:['Saved'],preparing:['Saved'],saved:['Saved'],wishlist:['Saved'],applied:['Applied'],'follow-up':['Applied'],followup:['Applied'],'interview 1':['Interviewing'],'interview 2':['Interviewing'],'final interview':['Interviewing'],assignment:['Interviewing'],interviewing:['Interviewing'],interview:['Interviewing'],offer:['Offer'],accepted:['Closed','Accepted'],rejected:['Closed','Rejected'],withdrawn:['Closed','Withdrawn'],'no response':['Closed','No response'],ghosted:['Closed','No response'],'declined offer':['Closed','Declined offer'],declined:['Closed','Declined offer'],closed:['Closed','Rejected']};
const COMPANY_STATUSES=['To research','Ready to contact','Contacted','In conversation','Applied','Not interested'];
const INTERVIEW_TYPES=['Phone screen','Video call','On-site','Case / assignment','Final round','Other'];
const cats=['Creative Director','Art Director','Graphic Designer','Brand Designer','Marketing Manager','Marketing Coordinator','Event Manager','Event Producer','Project Manager','Communications','AI / Creative Technology','AI / Marketing','Other'];
const industries=['Creative agency','Design studio','Events','Music / Culture','AI / Technology','Startup','Corporate','Other'];
const arrangements=['On-site','Hybrid','Remote'];

const JOB_GROUPS=[
 ['Role',[['jobUrl','Job posting URL','url',1],['category','Job category','select',0,cats],['industry','Industry','select',0,industries],['employment','Employment type','select',0,['Full-time','Part-time','Freelance','Contract','Internship']],['opportunity','Opportunity type','select',0,['Published opening','Spontaneous application']],['location','City / location','text'],['arrangement','Work arrangement','select',0,arrangements],['commute','Commute one way (min)','number'],['languages','Required languages','text'],['languageFit','Language fit','select',0,['Strong match','Partial match','Not a match','Unknown']],['posted','Posted on','date'],['applied','Applied on','date'],['assignment','Assignment deadline','date']]],
 ['Pay',[['gross','Advertised gross / month (€)','number'],['expectedGross','Your ask, gross / month (€)','number'],['benefits','Benefits / perks','text',1]]],
 ['Contact',[['contact','Contact name','text'],['contactRole','Contact role','text'],['email','Email / LinkedIn','text',1],['lastContact','Last contact','date']]]];
const COMPANY_FIELDS=[['website','Website','url',1],['industry','Industry','text'],['location','Location','text'],['role','Roles to explore','text',1],['contact','Contact name','text'],['email','Email / LinkedIn','text'],['lastContact','Last contacted','date']];

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoLocal(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return isoLocal(x)};
const daysBetween=(a,b)=>Math.round((Date.parse(b.slice(0,10))-Date.parse(a.slice(0,10)))/864e5);
const daysSince=d=>d?daysBetween(d,today()):null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').toLowerCase().replace(/\s+/g,' ').trim();
const coKey=v=>String(v??'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const plural=(n,w)=>`${n} ${n===1?w:w.endsWith('y')?w.slice(0,-1)+'ies':w+'s'}`;
const money=v=>v!==''&&v!=null&&Number.isFinite(+v)?new Intl.NumberFormat('en-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+v):'—';
const dt=v=>{if(!v)return '—';const d=new Date(v.slice(0,10)+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})})};
const relDate=v=>{if(!v)return '—';const n=daysBetween(today(),v);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>1&&n<7?`In ${n} days`:n<-1&&n>-7?`${-n} days ago`:dt(v)};
const estimateNet=g=>g?Math.max(0,Math.round((+g*0.8693-300)*.78+300)):null; // approximate only
let save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function stageFrom(text){
 const t=norm(text);if(!t)return null;
 const exact=STAGES.find(s=>norm(s)===t);if(exact)return [exact];
 const out=OUTCOMES.find(o=>norm(o)===t);if(out)return ['Closed',out];
 if(LEGACY[t])return LEGACY[t];
 if(/interview|assessment|case/.test(t))return ['Interviewing'];
 if(/reject|declin|unsuccess/.test(t))return ['Closed','Rejected'];
 if(/appl|sent|submit/.test(t))return ['Applied'];
 return null;
}
const legacyStatus=a=>a.stage==='Closed'?(a.outcome==='Declined offer'?'Withdrawn':a.outcome):({Saved:'Interested',Applied:'Applied',Interviewing:'Interview 1',Offer:'Offer'})[a.stage];

function companyFor(name,create,d=data){
 const n=coKey(name);if(!n)return null;
 let c=d.companies.find(c=>coKey(c.name)===n);
 if(!c&&create){c={id:uid(),name:String(name).trim(),status:'To research',interest:'',createdAt:today()};d.companies.push(c)}
 return c;
}
function legacyInterviews(a){
 return [['interview1','Interview 1'],['interview2','Interview 2'],['finalInterview','Final interview']].filter(([k])=>a[k]).map(([k,t])=>({id:uid(),date:a[k],type:t,notes:''}));
}
function migrateApp(a,d){
 a.id||=uid();
 if(!STAGES.includes(a.stage)){const m=stageFrom(a.status)||['Saved'];a.stage=m[0];a.outcome=m[1]||''}
 a.outcome=a.stage==='Closed'?(a.outcome||'Rejected'):'';
 if(!Array.isArray(a.interviews))a.interviews=legacyInterviews(a);
 if(!Array.isArray(a.activity))a.activity=[];
 a.createdAt||=a.posted||a.applied||today();
 a.stageSince||=(a.stage==='Applied'&&a.applied)||a.createdAt;
 a.source||='Manual';
 a.company=String(a.company||'').trim();
 if(a.company&&!d.companies.some(c=>c.id===a.companyId))a.companyId=companyFor(a.company,true,d).id;
 a.status=legacyStatus(a);
}
function migrate(d){
 d=d&&typeof d==='object'?d:initial();
 d.applications=Array.isArray(d.applications)?d.applications:[];
 d.companies=Array.isArray(d.companies)?d.companies:[];
 d.settings={...DEFAULT_SETTINGS,...(d.settings||{})};
 d.companies.forEach(c=>{c.id||=uid();c.status||='To research'});
 d.applications.forEach(a=>migrateApp(a,d));
 return d;
}
let data;try{data=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){data=migrate(null)}
save();

// ---------- Derived state ----------
const isActive=a=>a.stage!=='Closed';
const isOverdue=r=>r.followUp&&r.followUp<today();
const isQuiet=a=>a.stage==='Applied'&&!a.followUp&&daysSince(a.stageSince)>=(+data.settings.staleDays||21);
const nextInterview=a=>a.interviews.filter(i=>i.date&&i.date.slice(0,10)>=today()).sort((x,y)=>x.date.localeCompare(y.date))[0];
const needsStep=a=>ACTIVE_STAGES.includes(a.stage)&&!a.followUp&&!nextInterview(a)&&!isQuiet(a);
const everApplied=a=>!!a.applied||ACTIVE_STAGES.includes(a.stage)||(a.stage==='Closed'&&a.outcome!=='Withdrawn');
const reachedInterview=a=>a.interviews.length>0||['Interviewing','Offer'].includes(a.stage)||['Accepted','Declined offer'].includes(a.outcome);
const reachedOffer=a=>a.stage==='Offer'||['Accepted','Declined offer'].includes(a.outcome);
function funnel(){const a=data.applications;return {total:a.length,applied:a.filter(everApplied).length,interview:a.filter(reachedInterview).length,offer:a.filter(reachedOffer).length}}
function actionItems(){
 const jobs=data.applications.filter(a=>isActive(a)&&a.followUp).map(r=>({kind:'job',rec:r,date:r.followUp,text:r.nextAction||NEXT[r.stage]}));
 const cos=data.companies.filter(c=>c.followUp&&c.status!=='Not interested').map(r=>({kind:'company',rec:r,date:r.followUp,text:r.nextAction||'Reach out'}));
 return [...jobs,...cos].sort((a,b)=>a.date.localeCompare(b.date));
}
function upcomingInterviews(){
 const t=today();
 return data.applications.filter(isActive).flatMap(a=>a.interviews.filter(i=>i.date&&i.date.slice(0,10)>=t).map(i=>({a,i}))).sort((x,y)=>x.i.date.localeCompare(y.i.date));
}
const jobsFor=c=>data.applications.filter(a=>a.companyId===c.id);
const attentionCount=()=>actionItems().filter(i=>i.date<=today()).length;

// ---------- Mutations ----------
const touch=r=>{r.updatedAt=new Date().toISOString()};
function log(r,text){(r.activity||=[]).push({at:new Date().toISOString(),text});if(r.activity.length>200)r.activity.shift()}
function linkCompany(a){const c=companyFor(a.company,true);a.companyId=c?c.id:''}
function setStage(a,stage,outcome){
 outcome=stage==='Closed'?(outcome||a.outcome||'Rejected'):'';
 if(a.stage===stage&&(a.outcome||'')===outcome)return false;
 const prev=a.stage,t=today();
 a.stage=stage;a.outcome=outcome;a.stageSince=t;
 if(stage==='Applied'&&!a.applied)a.applied=t;
 if(stage==='Closed')a.followUp='';
 else{
  if(!a.nextAction||a.nextAction===NEXT[prev])a.nextAction=NEXT[stage];
  if(stage==='Applied'&&!a.followUp){const f=addDays(a.applied||t,+data.settings.followUpDays||7);if(f>=t)a.followUp=f}
 }
 if(stage==='Applied'){const c=data.companies.find(c=>c.id===a.companyId);if(c&&['To research','Ready to contact'].includes(c.status))c.status='Applied'}
 a.status=legacyStatus(a);
 log(a,prev?`${prev} → ${stage}${outcome?' ('+outcome+')':''}`:`Stage set to ${stage}`);
 touch(a);return true;
}
function addJob(rec,source='Manual'){
 const t=today(),target=stageFrom(rec.stage||rec.status)||['Saved'];
 const a={...rec,id:uid(),source,createdAt:t,stage:'Saved',outcome:'',stageSince:t,interviews:legacyInterviews(rec),activity:[]};
 delete a.status;
 a.company=String(a.company||'').trim();a.title=String(a.title||'').trim();
 linkCompany(a);
 log(a,source==='Manual'?'Added':'Added via '+source);
 if(target[0]==='Saved'){a.nextAction||=NEXT.Saved;a.status=legacyStatus(a)}
 else{setStage(a,target[0],target[1]);if(a.stage==='Applied'&&rec.applied)a.stageSince=rec.applied}
 touch(a);data.applications.unshift(a);return a;
}
function removeJob(id){
 const i=data.applications.findIndex(a=>a.id===id);if(i<0)return;
 const [rec]=data.applications.splice(i,1);
 save();if(drawer&&drawer.id===id)closeDrawer(true);else render();
 toast('Job deleted',()=>{data.applications.splice(i,0,rec);save();render()});
}
function removeCompany(id){
 const i=data.companies.findIndex(c=>c.id===id);if(i<0)return;
 const [rec]=data.companies.splice(i,1),linked=data.applications.filter(a=>a.companyId===id);
 linked.forEach(a=>a.companyId='');
 save();if(drawer&&drawer.id===id)closeDrawer(true);else render();
 toast('Company deleted',()=>{data.companies.splice(i,0,rec);linked.forEach(a=>a.companyId=id);save();render()});
}
function findRec(kind,id){return (kind==='job'?data.applications:data.companies).find(r=>r.id===id)}
function markDone(kind,id){
 const r=findRec(kind,id);if(!r)return;
 const before={nextAction:r.nextAction,followUp:r.followUp};
 log(r,'Done: '+(r.nextAction||'follow-up'));
 r.nextAction='';r.followUp='';touch(r);save();refresh();
 toast(kind==='job'&&isActive(r)?'Done. Set its next step when you know it.':'Marked done',()=>{Object.assign(r,before);r.activity.pop();save();refresh()});
}
function snooze(kind,id,days){
 const r=findRec(kind,id);if(!r)return;
 const base=r.followUp&&r.followUp>today()?r.followUp:today();
 r.followUp=addDays(base,days);log(r,'Snoozed to '+dt(r.followUp));touch(r);save();refresh();
 toast(`Moved to ${dt(r.followUp)}`);
}
function schedule(id,days){
 const a=findRec('job',id);if(!a)return;
 a.followUp=addDays(today(),days);a.nextAction||=NEXT[a.stage]||'Follow up';touch(a);save();refresh();
 toast(`Next step set for ${dt(a.followUp)}`);
}
function closeQuiet(id){
 const a=findRec('job',id);if(!a)return;
 setStage(a,'Closed','No response');save();refresh();
 toast('Closed as no response',()=>{setStage(a,'Applied');save();refresh()});
}
function setField(id,k,v){const a=findRec('job',id);if(!a||(a[k]??'')===v)return;a[k]=v;touch(a);save();refresh()}

// ---------- Duplicates & URL helpers ----------
const KEEP_PARAMS=['jk','vjk','currentjobid','gh_jid','jobid','job_id','id','jid'];
function urlKey(u){
 try{const x=new URL(String(u).trim());const keep=[...x.searchParams].filter(([k])=>KEEP_PARAMS.includes(k.toLowerCase())).map(([k,v])=>k.toLowerCase()+'='+v).sort().join('&');
  return (x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/+$/,'')).toLowerCase()+(keep?'?'+keep:'')}catch(e){return ''}
}
function findDuplicate(rec,exceptId){
 const k=urlKey(rec.jobUrl),c=coKey(rec.company),t=norm(rec.title);
 return data.applications.find(a=>a.id!==exceptId&&((k&&urlKey(a.jobUrl)===k)||(c&&t&&coKey(a.company)===c&&norm(a.title)===t)));
}
function guessCompany(raw){
 try{
  const u=new URL(String(raw).trim()),host=u.hostname.replace(/^www\./,''),seg=u.pathname.split('/').filter(Boolean);let name='';
  if(/^(boards|job-boards)\.greenhouse\.io$|^jobs\.(lever\.co|ashbyhq\.com)$|^apply\.workable\.com$|^jobs\.smartrecruiters\.com$/.test(host))name=seg[0];
  else if(host==='join.com'||host==='welcometothejungle.com'){const i=seg.indexOf('companies');if(i>=0)name=seg[i+1]}
  else if(/\.(recruitee\.com|teamtailor\.com|bamboohr\.com|breezy\.hr|personio\.(de|com)|workable\.com|myworkdayjobs\.com|homerun\.co|jobs\.personio\.de)$/.test(host))name=host.split('.')[0];
  else if(/linkedin|indeed|glassdoor|stepstone|jobat|ictjob|monster|google|welcome|talent\.com|jooble|actiris|vdab|forem/.test(host))return '';
  else{const p=host.split('.');let i=p.length-2;if(i>0&&/^(co|com|org|net)$/.test(p[i]))i--;name=p[i]}
  return name?decodeURIComponent(name).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'';
 }catch(e){return ''}
}
function jobLink(a){
 const raw=String(a.jobUrl||'').trim();if(!raw)return '';
 try{const url=new URL(raw);return ['https:','http:'].includes(url.protocol)?url.href:''}catch(e){return ''}
}
const EXT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-10 10"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg>';
function jobWebIcon(a){const url=jobLink(a);return url?`<a class="job-web-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open job posting" aria-label="Open job posting">${EXT_ICON}</a>`:''}

// ---------- UI helpers ----------
const ICONS={
 today:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
 pipeline:'<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="10" y="4" width="5" height="10" rx="1.2"/><rect x="17" y="4" width="4" height="13" rx="1.2"/>',
 companies:'<path d="M3 21h18"/><path d="M5 21V7l7-4v18"/><path d="M19 21V11l-7-4"/><path d="M9 9h.01M9 13h.01M9 17h.01"/>',
 data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const navs=[['today','Today'],['pipeline','Pipeline'],['companies','Companies'],['data','Import & export'],['settings','Settings']];
const sdot=s=>`<span class="sdot s-${s}"></span>`;
const dots=n=>n?`<span class="dots" title="Interest ${n}/5">${'●'.repeat(+n)}<i>${'●'.repeat(5-n)}</i></span>`:'';
const optionsWith=(list,val,blank)=>(blank?`<option value="">${blank}</option>`:'')+[...list,...(val&&!list.includes(val)?[val]:[])].map(o=>`<option value="${esc(o)}" ${String(val??'')===String(o)?'selected':''}>${esc(o)}</option>`).join('');
function stageOptions(a){
 const cur=a.stage==='Closed'?'Closed|'+a.outcome:a.stage;
 return STAGES.filter(s=>s!=='Closed').map(s=>`<option value="${s}" ${cur===s?'selected':''}>${s}</option>`).join('')+
  `<optgroup label="Closed">${OUTCOMES.map(o=>`<option value="Closed|${o}" ${cur==='Closed|'+o?'selected':''}>Closed · ${o}</option>`).join('')}</optgroup>`;
}
function header(kicker,title,subtitle,buttons=''){return `<div class="top"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="actions">${buttons}</div></div>`}
function metric(name,value,hint){return `<div class="metric"><label>${name}</label><div class="num">${value}</div><div class="hint">${hint}</div></div>`}
const addBtn=`<button class="btn primary" onclick="quickAdd()">+ Add job</button>`;
let toastTimer;
function toast(msg,undo){
 const el=$('#toast');clearTimeout(toastTimer);
 el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
 if(undo)el.querySelector('button').onclick=()=>{el.classList.remove('show');undo()};
 el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),undo?6000:3000);
}

// ---------- Routing ----------
let page='today',drawer=null,query='',sel=new Set();
let appView=store.get('tjs_app_view','board'),show=store.get('tjs_show','active');
let sortKey=store.get('tjs_sort','next'),sortDir=+store.get('tjs_sortdir','1');
const PAGES={today:todayPage,pipeline:pipelinePage,companies:companiesPage,data:dataPage,settings:settingsPage};
function go(p){location.hash='#/'+p}
function openJob(id){location.hash=`#/${page}/job/${encodeURIComponent(id)}`}
function openCompany(id){location.hash=`#/${page}/company/${encodeURIComponent(id)}`}
function route(){
 const parts=location.hash.replace(/^#\/?/,'').split('/');
 const p=PAGES[parts[0]]?parts[0]:'today';
 if(p!==page){page=p;query='';sel.clear();window.scrollTo(0,0)}

 `<div class="viewbar"><div class="viewtabs" role="tablist"><button role="tab" class="${appView==='board'?'selected':''}" onclick="setAppView('board')">Board</button><button role="tab" class="${appView==='table'?'selected':''}" onclick="setAppView('table')">Table</button></div>

function setAppView(v){appView=v;store.set('tjs_app_view',v);sel.clear();render()}

const matchesQuery=a=>{const q=norm(query);return !q||norm([a.company,a.title,a.location,a.category,a.industry,a.contact,a.nextAction,a.notes].join(' ')).includes(q)};
function filteredJobs(){
 return data.applications.filter(a=>{
  if(show==='active'&&!isActive(a))return false;
  if(show==='attention'&&!(isActive(a)&&(isOverdue(a)||needsStep(a)||isQuiet(a))))return false;
  if(STAGES.includes(show)&&a.stage!==show)return false;
  return matchesQuery(a);
 });
}
const SORTS={
 role:a=>norm(a.company+' '+a.title),stage:a=>STAGES.indexOf(a.stage),next:a=>a.followUp||'9999',
 interest:a=>-(+a.interest||0),applied:a=>a.applied||'0000',location:a=>norm(a.location)||'~',gross:a=>-(+a.gross||0)};
function sortBy(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}store.set('tjs_sort',sortKey);store.set('tjs_sortdir',sortDir);drawPipeline()}
function drawPipeline(){
 if(page!=='pipeline')return;
 const root=$('#results'),list=filteredJobs(),sub=$('.top .sub');
 if(sub)sub.textContent=`${plural(data.applications.filter(isActive).length,'active job')} · ${data.applications.length} in total`;
 const scroll=root.querySelector('.board')?.scrollLeft||0;
 $('#bulkbar').innerHTML=appView==='table'&&sel.size?`<div class="bulk"><b>${sel.size} selected</b><select aria-label="Move selected" onchange="bulkStage(this.value)"><option value="">Move to…</option>${stageOptions({stage:''})}</select><button class="btn sm" onclick="bulkDelete()">Delete</button><button class="link" onclick="sel.clear();drawPipeline()">Clear</button></div>`:'';
 if(!data.applications.length){root.innerHTML=`<div class="panel empty"><strong>No jobs yet</strong><p>Save a role with the Chrome extension, add one by hand, or import a CSV.</p><div class="actions" style="justify-content:center">${addBtn}<button class="btn" onclick="go('data')">Import CSV</button></div></div>`;return}
 if(appView==='board'){
  const closedTotal=data.applications.filter(a=>a.stage==='Closed'&&matchesQuery(a)).length;
  const order=(a,b)=>(isOverdue(b)-isOverdue(a))||(a.followUp||'9999').localeCompare(b.followUp||'9999')||(b.updatedAt||'').localeCompare(a.updatedAt||'');
  root.innerHTML=`<div class="board">${STAGES.map(st=>{
   const items=list.filter(a=>a.stage===st).sort(order),collapsed=st==='Closed'&&show==='active';
   return `<section class="col ${collapsed?'collapsed':''}" data-stage="${st}" ondragover="dragOver(event)" ondragleave="this.classList.remove('over')" ondrop="dropOn(event,'${st}')">
   <div class="col-head">${sdot(st)}<strong>${st}</strong><span class="count">${collapsed?closedTotal:items.length}</span></div>
   <div class="col-items">${collapsed?`<button class="col-collapsed" onclick="setShow('all')">${closedTotal?`Show ${closedTotal} closed`:'Drop a card here to close it'}</button>`:items.map(card).join('')||`<div class="col-empty">${st==='Saved'?'Jobs you save land here':'Drag a card here'}</div>`}</div></section>`}).join('')}</div>`;
  root.querySelector('.board').scrollLeft=scroll;return;
 }
 if(!list.length){root.innerHTML=`<div class="panel empty"><strong>Nothing matches</strong>Try another search or filter.</div>`;return}
 const sorted=[...list].sort((a,b)=>{const x=SORTS[sortKey](a),y=SORTS[sortKey](b);return (x<y?-1:x>y?1:0)*sortDir});
 const th=(k,l)=>`<th class="sortable" onclick="sortBy('${k}')" aria-sort="${sortKey===k?(sortDir>0?'ascending':'descending'):'none'}">${l}${sortKey===k?(sortDir>0?' ↑':' ↓'):''}</th>`;
 const all=sorted.every(a=>sel.has(a.id));
 root.innerHTML=`<div class="tablewrap"><table><thead><tr><th style="width:34px"><input type="checkbox" aria-label="Select all" ${all?'checked':''} onchange="selectAll(this.checked)"></th>${th('role','Role')}${th('stage','Stage')}${th('next','Next step')}${th('interest','Interest')}${th('applied','Applied')}${th('location','Location')}${th('gross','Salary')}</tr></thead><tbody>${sorted.map(row).join('')}</tbody></table></div>`;

function card(a){

 return `<article class="card" draggable="true" ondragstart="dragStart(event,'${a.id}')" ondragend="this.classList.remove('dragging')" onclick="openJob('${a.id}')">

function stepLine(a){
 if(a.stage==='Closed')return `<div class="step closed">${esc(a.outcome)}</div>`;

 <td onclick="event.stopPropagation()"><select class="stage-select" aria-label="Stage" onchange="pickStage(event,'${a.id}')">${stageOptions(a)}</select></td>

 <td onclick="event.stopPropagation()"><select class="inline" aria-label="Interest" style="width:76px" onchange="setField('${a.id}','interest',this.value)"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${+a.interest===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select></td>
 <td>${dt(a.applied)}</td><td>${esc(a.location||'—')}</td><td>${money(a.gross)}</td></tr>`;

function pickStage(e,id){
 e.stopPropagation();const a=findRec('job',id);if(!a)return;

 $('#cd-ok').onclick=()=>{closeDialog();fn()};$('#cd-ok').focus();

function parseCSV(text){
 text=text.replace(/^﻿/,'');
 const first=text.split(/\r?\n/,1)[0],count=c=>first.split(c).length;
 const delim=[',',';','\t'].sort((a,b)=>count(b)-count(a))[0];
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
  else if(c==='"')q=true;
  else if(c===delim){row.push(cell);cell=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
  else cell+=c;
 }
 if(cell||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(v=>v.trim()));
}
const IMPORT_FIELDS=[['','Ignore this column'],['company','Company'],['title','Job title'],['jobUrl','Job URL'],['stage','Stage / status'],['location','Location'],['arrangement','Work arrangement'],['employment','Employment type'],['opportunity','Opportunity type'],['category','Job category'],['industry','Industry'],['applied','Applied on'],['posted','Posted on'],['followUp','Follow-up date'],['nextAction','Next step'],['interest','Interest (1–5)'],['gross','Gross salary / month'],['expectedGross','Your ask / month'],['benefits','Benefits'],['contact','Contact name'],['contactRole','Contact role'],['email','Contact email / LinkedIn'],['lastContact','Last contact'],['languages','Languages'],['commute','Commute (min)'],['notes','Notes'],['interview1','Interview date'],['interview2','Second interview date'],['finalInterview','Final interview date']];
const SYNONYMS={company:'company companyname employer organization organisation entreprise societe bedrijf firm',title:'title jobtitle position role job poste functie jobname vacancy',jobUrl:'joburl url link joblink postingurl jobpostingurl applicationlink listing',stage:'stage status applicationstatus state statut',location:'location city citylocation ville place',applied:'applied appliedon dateapplied applicationdate applieddate',posted:'posted postedon postingdate jobpostingdate dateposted',followUp:'followup followupdate nextdate due duedate reminder',nextAction:'nextaction nextstep todo action',gross:'gross salary pay advertisedgross compensation grosssalary',notes:'notes note comments comment description',email:'email contactemail linkedin contactemaillinkedin',contact:'contact contactname recruiter hiringmanager',arrangement:'arrangement workarrangement remote worktype',employment:'employment employmenttype jobtype contract'};
const headerKey=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
function guessField(h){
 const n=headerKey(h);
 const direct=IMPORT_FIELDS.find(([k,l])=>k&&(headerKey(k)===n||headerKey(l)===n));if(direct)return direct[0];
 for(const [k,list] of Object.entries(SYNONYMS))if(list.split(' ').includes(n))return k;
 return '';
}
function normDate(s){
 s=String(s||'').trim();if(!s)return '';
 if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
 const m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
 if(m){let [,d,mo,y]=m.map(Number);if(y<100)y+=2000;if(mo>12&&d<=12)[d,mo]=[mo,d];if(mo<=12&&d<=31)return `${y}-${pad(mo)}-${pad(d)}`}
 const t=Date.parse(s);return Number.isNaN(t)?'':isoLocal(new Date(t));
}
const normNum=s=>{const n=parseFloat(String(s).replace(/[^\d,.\-]/g,'').replace(/[.,](?=\d{3}(\D|$))/g,'').replace(',','.'));return Number.isFinite(n)?String(Math.round(n)):''};
let csv=null;
async function startCsv(file){
 if(!file)return;
 try{
  const rows=parseCSV(await file.text());
  if(rows.length<2)throw Error('the file needs a header row and at least one job');
  csv={name:file.name,headers:rows[0],body:rows.slice(1),mapping:rows[0].map(guessField),skipDup:true};
  csvDialog();
 }catch(e){toast('Could not read CSV: '+e.message)}
}
function csvRecords(){
 return csv.body.map(r=>{
  const o={};csv.mapping.forEach((k,i)=>{const v=String(r[i]??'').trim();if(k&&v)o[k]=v});
  ['applied','posted','followUp','lastContact'].forEach(k=>{if(o[k])o[k]=normDate(o[k])});
  ['interview1','interview2','finalInterview'].forEach(k=>{if(o[k])o[k]=normDate(o[k])});
  ['gross','expectedGross','commute'].forEach(k=>{if(o[k])o[k]=normNum(o[k])});
  if(o.interest){const n=Math.round(+o.interest);o.interest=n>=1?String(Math.min(5,n)):''}
  if(o.jobUrl&&!jobLink(o))delete o.jobUrl;
  if(!o.stage&&o.applied)o.stage='Applied';
  return o;
 }).filter(o=>o.company||o.title);
}
function csvDialog(){

 let dups=0;recs.forEach(r=>{const k=urlKey(r.jobUrl)||norm(r.company)+'|'+norm(r.title);if(findDuplicate(r)||seen.has(k))dups++;seen.add(k)});
 const n=csv.skipDup?recs.length-dups:recs.length,missing=!csv.mapping.includes('company')&&!csv.mapping.includes('title');
 $('#overlay').innerHTML=`<div class="dialogback"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="csv-t">
 <div class="dialogheader"><div><div class="eyebrow">${esc(csv.name)}</div><h2 id="csv-t">Match your columns</h2></div><button class="close" onclick="closeDialog()" aria-label="Close">✕</button></div>
 <p class="sub">We guessed where each column goes. Change any that look wrong, or ignore columns you don't need.</p>
 <table class="maptable"><thead><tr><th>Your column</th><th>Example</th><th>Goes into</th></tr></thead><tbody>${csv.headers.map((h,i)=>`<tr><td><b>${esc(h||'(no name)')}</b></td><td class="sample">${esc(csv.body.find(r=>r[i])?.[i]||'')}</td><td><select aria-label="Field for ${esc(h)}" onchange="csv.mapping[${i}]=this.value;csvDialog()">${IMPORT_FIELDS.map(([k,l])=>`<option value="${k}" ${csv.mapping[i]===k?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>
 ${missing?`<div class="dup">Map at least a <b>Company</b> or <b>Job title</b> column to import.</div>`:`<div class="note">${plural(recs.length,'job')} found${dups?`, <b>${dups}</b> already in your tracker or repeated in the file`:''}. Jobs with an applied date and no status come in as <i>Applied</i>.</div>`}
 <div class="dialogfooter"><label class="tiny">${dups?`<input type="checkbox" ${csv.skipDup?'checked':''} onchange="csv.skipDup=this.checked;csvDialog()"> Skip duplicates`:''}</label><div class="actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" ${missing||!n?'disabled':''} onclick="doCsvImport()">Import ${plural(n,'job')}</button></div></div>
 </div></div>`;
}
function doCsvImport(){
 const before=[...data.applications],companiesBefore=data.companies.length;let added=0,skipped=0;
 [...csvRecords()].reverse().forEach(r=>{if(csv.skipDup&&findDuplicate(r)){skipped++;return}addJob(r,'CSV');added++});
 save();closeDialog();csv=null;go('pipeline');refresh();
 toast(`Imported ${plural(added,'job')}${skipped?`, skipped ${skipped}`:''}`,()=>{data.applications=before;data.companies.length=companiesBefore;save();render()});
}

// ---------- Settings ----------
function settingsPage(){
 const s=data.settings,f=(k,l,type,extra='')=>`<div class="formfield"><label for="s-${k}">${l}</label><input class="field" id="s-${k}" type="${type}" value="${esc(s[k])}" ${extra} onchange="saveSetting('${k}',this)"></div>`;
 return header('Preferences','Settings','Your goals and how the tracker nudges you. Changes save automatically.')+
 `<div class="settings panel"><h2 style="margin-bottom:14px">Goals</h2><div class="gridform">${f('weeklyGoal','Applications per week','number','min="1"')}${f('targetNet','Target net salary / month (€)','number','min="0"')}<div class="formfield full">${f('home','Commute from','text').replace(/^<div class="formfield">|<\/div>$/g,'')}</div></div>
 <h2 style="margin:22px 0 14px">Reminders</h2><div class="gridform">${f('followUpDays','Follow up after applying (days)','number','min="1"')}${f('staleDays','Flag as gone quiet after (days)','number','min="1"')}</div>
 <p class="hintline" style="margin-top:10px">Moving a job to <i>Applied</i> sets a follow-up this many days later. Applications with no reply after the quiet threshold show up on Today.</p>
 <div class="note">Net salary estimates use a simplified Belgian employee-pay approximation and can differ substantially from actual net pay.</div></div>`;
}
function saveSetting(k,el){
 const num=el.type==='number';let v=num?Math.max(+el.min||0,Math.round(+el.value)||DEFAULT_SETTINGS[k]):el.value;
 data.settings[k]=v;if(num)el.value=v;save();nav();toast('Saved');
}

// ---------- Keyboard ----------
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#overlay').innerHTML){closeDialog();e.preventDefault()}else if(drawer){closeDrawer();e.preventDefault()}return}
 if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('#overlay').innerHTML)return;
 if(e.key==='n'){e.preventDefault();quickAdd()}
 else if(e.key==='/'){const s=$('main .search');if(s){e.preventDefault();s.focus()}}
});
$('#drawer').addEventListener('input',onDrawerEdit);
$('#drawer').addEventListener('change',onDrawerEdit);
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#jobimport='))return handleExtensionImport();if(drawer)flushDrawer();route()});
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(nav,150)});

// ---------- Chrome extension import bridge ----------
// The extension opens this page with #jobimport=<json>. The fragment is removed immediately.
function handleExtensionImport(){
 const prefix='#jobimport=';if(!location.hash.startsWith(prefix))return false;
 const encoded=location.hash.slice(prefix.length);
 history.replaceState(null,'',location.pathname+location.search+'#/pipeline');
 page='pipeline';
 try{
  if(encoded.length>20000)throw Error('Import too large');
  const job=JSON.parse(decodeURIComponent(encoded));
  if(!job||typeof job!=='object'||!job.company||!job.title||!/^https?:\/\//.test(job.jobUrl||''))throw Error('Invalid job');
  const allowed=['company','title','location','jobUrl','posted','employment','arrangement','languages','gross','notes','status','opportunity','nextAction'];
  const rec={opportunity:'Published opening',...Object.fromEntries(allowed.filter(k=>typeof job[k]==='string'||typeof job[k]==='number').map(k=>[k,String(job[k]).slice(0,k==='notes'?4000:500)]))};
  if(typeof job.jobType==='string'&&!rec.employment)rec.employment=job.jobType.slice(0,500);
  const dup=findDuplicate(rec);
  if(dup){route();openJob(dup.id);toast('Already in your tracker. Opened the saved job.');return true}
  const a=addJob(rec,'Extension');save();route();openJob(a.id);
  toast(`Saved “${a.title.slice(0,60)}”`,()=>{data.applications=data.applications.filter(x=>x.id!==a.id);save();closeDrawer(true)});
 }catch(e){route();toast('Job import failed: '+e.message)}
 return true;
}
if(!handleExtensionImport())route();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="cloud.js"></script>
